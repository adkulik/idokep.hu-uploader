blueprint:
  name: Időkép Automata Feltöltő (Univerzális)
  description: >-
    Beküldi az okosotthon meteorológiai adatait az Időkép állomásodhoz, a Home
    Assistant beépített `rest_command` integrációjával.


    **Előfeltétel:** a `rest_command.idokep_get` parancsnak léteznie kell a
    `configuration.yaml` fájlban. A helyes forma:


    ```yaml

    rest_command:
      idokep_get:
        url: "{{ url }}"
        method: get
        headers:
          User-Agent: "IdokepAutomata/500 (Windows)"
        timeout: 15
    ```


    A blokk felvétele után indítsd újra a Home Assistantot.


    **Frissítés 1.x-ről:** a 2.0 a `shell_command` helyett `rest_command`-ot
    használ. Vedd fel a fenti blokkot, indítsd újra a Home Assistantot, és csak
    utána importáld újra a sablon-automatizmust. A régi `shell_command.idokep_get`
    sor ezután törölhető. Az automatizmusod beállításait nem kell módosítani.


    **Hibakezelés:** ha az Időkép hibakóddal (4xx/5xx) válaszol, vagy nem
    válaszol időben, a Home Assistant ezt a rendszernaplóba írja. A válasz
    szövegét a sablon-automatizmus nem ellenőrzi.


    **Biztonsági megjegyzés:** a jelszó az URL-ben utazik, és hiba esetén a
    Home Assistant a teljes URL-t — benne az állomás jelszavával — kiírhatja a
    rendszernaplóba, ami bekerül a diagnosztikai csomagokba és a biztonsági
    mentésekbe is. Használj az Időkép-állomásodhoz külön, máshol nem használt
    jelszót.


    **Mértékegységek:** a szélsebességet és a széllökést a szenzor saját
    mértékegysége alapján váltja át m/s-ra (km/h, m/s, mph és csomó
    támogatott). A szélirány fokban vagy égtáj-rövidítésként is megadható.


    ### ❗ Fontos figyelmeztetés: Csak hiteles adatokat tölts fel!


    Az Időkép térképeit és előrejelzéseit emberek százezrei használják nap mint
    nap. Kérjük, **csak és kizárólag akkor indíts adatfeltöltést, ha a
    szenzoraid elhelyezése megfelel a meteorológiai szabványoknak!** A rossz
    helyre tett műszerek (pl. napon lévő hőmérő, fal melletti szélmérő) hibás
    adatokat generálnak, amivel rontod a hálózat megbízhatóságát.


    #### 📐 Műszerelhelyezési útmutató


    * **Hőmérő és páratartalom mérő:** 2 méter magasságban, árnyékos helyen
    (lehetőleg szabványos hőmérőházban vagy tányéros árnyékolóban) kell
    elhelyezni. Szigorúan tilos falhoz, betonhoz vagy olyan felülethez
    rögzíteni, ami hőt sugározhat magából!

    * **Szélmérő:** Szabad, nyílt területen, a talajszinttől számítva ideálisan
    10 méter magasan kell lennie. Ha erre nincs mód, akkor a környező akadályok
    (háztető, fák) fölé kell nyúlnia legalább 2-3 méterrel, hogy a légáramlás
    akadálytalanul érje.

    * **Csapadékmérő:** Nyílt, vízszintes területen, a talajtól nagyjából
    1-1,5 méter magasságban telepítve. Ügyelj rá, hogy épület, fa vagy tető ne
    takarja ki, és a szél ne tudjon belefújni faleveleket.

    * **Légnyomásmérő:** Beltéren is elhelyezhető, de figyelj arra, hogy a Home
    Assistant mindig **tengerszintre átszámított (relatív) légnyomásértéket**
    küldjön, ne pedig a szenzor által mért abszolút értéket.


    ---


    **Verzió:** 2.0 · [Forráskód és változásnapló](https://github.com/adkulik/idokep.hu-uploader)
  domain: automation
  source_url: https://raw.githubusercontent.com/adkulik/idokep.hu-uploader/refs/heads/main/idokep.hu-uploader.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    fiok:
      name: Időkép fiók
      icon: mdi:account-key
      collapsed: true
      input:
        idokep_user:
          name: Felhasználónév
          description: Az Időkép állomásod azonosítója.
          default: ""
          selector:
            text:
        idokep_pass:
          name: Jelszó
          description: Az állomáshoz tartozó jelszó.
          default: ""
          selector:
            text:
              type: password

    utemezes:
      name: Ütemezés
      icon: mdi:timer-outline
      collapsed: true
      input:
        feltoltes_gyakorisag:
          name: Feltöltés gyakorisága
          description: >-
            Milyen sűrűn küldjön adatot. Az Időkép percenkénti beküldést is
            elfogad, de 5 perc a legtöbb állomásnak bőven elég.
          default: "/5"
          selector:
            select:
              mode: dropdown
              options:
                - label: Percenként
                  value: "/1"
                - label: 2 percenként
                  value: "/2"
                - label: 5 percenként
                  value: "/5"
                - label: 10 percenként
                  value: "/10"
                - label: 15 percenként
                  value: "/15"

    merok:
      name: Hőmérséklet és Páratartalom
      icon: mdi:thermometer
      collapsed: true
      input:
        temp_sensor:
          name: Hőmérséklet (Kötelező)
          description: Kültéri hőmérséklet. Enélkül nem történik feltöltés.
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: temperature
        humidity_sensor:
          name: Páratartalom (Opcionális)
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: humidity
        pressure_sensor:
          name: Légnyomás (Opcionális)
          description: >-
            Lehetőleg a **tengerszintre korrigált** értéket add meg, ne a nyers
            állomásnyomást — az Időkép ezt várja.
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: atmospheric_pressure
        indoor_temp_sensor:
          name: Beltéri hőmérséklet (Opcionális)
          description: >-
            Ha megadod, a beltéri hőmérséklet is felkerül. Ha üresen hagyod,
            a paraméter egyszerűen kimarad a beküldésből.
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: temperature

    szel:
      name: Szél
      icon: mdi:weather-windy
      collapsed: true
      input:
        wind_dir_sensor:
          name: Szélirány (Opcionális)
          description: >-
            Fokban (0–360) **vagy** égtáj-rövidítésként megadott érték.
            Támogatott rövidítések: N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSW,
            SW, WSW, W, WNW, NW, NNW, valamint a magyar É, ÉK, K, DK, D, DNY,
            NY, ÉNY. A kis- és nagybetű nem számít.
          default: ""
          selector:
            entity:
              domain: sensor
        wind_speed_sensor:
          name: Szélsebesség (Opcionális)
          description: >-
            A mértékegységet a szenzorból olvassa ki és m/s-ra váltja.
          default: ""
          selector:
            entity:
              domain: sensor
        wind_gust_sensor:
          name: Széllökés (Opcionális)
          default: ""
          selector:
            entity:
              domain: sensor

    csapadek:
      name: Csapadék
      icon: mdi:weather-pouring
      collapsed: true
      input:
        rain_10m:
          name: 10 perces csapadék (Opcionális)
          default: ""
          selector:
            entity:
              domain: sensor
        rain_1h:
          name: 1 órás csapadék (Opcionális)
          default: ""
          selector:
            entity:
              domain: sensor
        rain_24h:
          name: Napi összesített csapadék (Opcionális)
          default: ""
          selector:
            entity:
              domain: sensor

mode: single
max_exceeded: silent

variables:
  user_name: !input idokep_user
  password: !input idokep_pass
  temp_sensor: !input temp_sensor
  hum_sensor: !input humidity_sensor
  press_sensor: !input pressure_sensor
  indoor_sensor: !input indoor_temp_sensor
  wdir_sensor: !input wind_dir_sensor
  wspeed_sensor: !input wind_speed_sensor
  wgust_sensor: !input wind_gust_sensor
  r_10m: !input rain_10m
  r_1h: !input rain_1h
  r_24h: !input rain_24h

triggers:
  - trigger: time_pattern
    minutes: !input feltoltes_gyakorisag

conditions:
  # Az összecsukható szekciók miatt a fiókadatok és a hőmérséklet-szenzor
  # üres alapértéket kaptak, ezért itt ellenőrizzük, hogy ki vannak-e töltve.
  - condition: template
    value_template: >-
      {{ user_name not in ['', none] and password not in ['', none]
         and temp_sensor not in ['', none] and is_number(states(temp_sensor)) }}

actions:
  # A választ szándékosan nem kérjük vissza (response_variable nélkül):
  # az Időkép válasza nem UTF-8 kódolású, és a rest_command ilyenkor
  # dekódolási hibát dob, amelynek üzenetében a jelszót tartalmazó URL is
  # a naplóba kerül. Válaszkérés nélkül a rest_command nem dekódolja a választ.
  - action: rest_command.idokep_get
    data:
      url: >-
        {%- set egtajak = {
          'n': 0.0, 'nne': 22.5, 'ne': 45.0, 'ene': 67.5,
          'e': 90.0, 'ese': 112.5, 'se': 135.0, 'sse': 157.5,
          's': 180.0, 'ssw': 202.5, 'sw': 225.0, 'wsw': 247.5,
          'w': 270.0, 'wnw': 292.5, 'nw': 315.0, 'nnw': 337.5,
          'é': 0.0, 'ék': 45.0, 'k': 90.0, 'dk': 135.0,
          'd': 180.0, 'dny': 225.0, 'ny': 270.0, 'ény': 315.0
        } -%}

        {%- set ms_szorzo = {
          'm/s': 1.0, 'km/h': 0.2777778, 'kph': 0.2777778,
          'mph': 0.44704, 'mi/h': 0.44704, 'kn': 0.5144444, 'kt': 0.5144444
        } -%}

        {%- macro szam(ertek) -%}
          {{ '%.2f' | format(ertek | float(0)) | replace('.', ',') }}
        {%- endmacro -%}

        {%- set ns = namespace(url =
          'http://pro.idokep.hu/sendws.php'
          ~ '?user=' ~ (user_name | string | urlencode)
          ~ '&pass=' ~ (password | string | urlencode)
          ~ '&ev=' ~ now().year
          ~ '&ho=' ~ now().month
          ~ '&nap=' ~ now().day
          ~ '&ora=' ~ now().hour
          ~ '&perc=' ~ now().minute
          ~ '&mp=' ~ now().second) -%}

        {#- Egyszerű számértékek: hőmérséklet, pára, nyomás, beltéri hőm. -#}
        {%- for kulcs, ent in [
              ('hom', temp_sensor),
              ('rh', hum_sensor),
              ('p', press_sensor),
              ('inhom', indoor_sensor),
              ('csap', r_10m),
              ('csap1h', r_1h),
              ('csaptotal', r_24h)
            ] -%}
          {%- if ent not in ['', none] and is_number(states(ent)) -%}
            {%- set ns.url = ns.url ~ '&' ~ kulcs ~ '=' ~ szam(states(ent)) | trim -%}
          {%- endif -%}
        {%- endfor -%}

        {#- Szélirány: fok vagy égtáj-rövidítés -#}
        {%- if wdir_sensor not in ['', none] -%}
          {%- set nyers = states(wdir_sensor) -%}
          {%- if is_number(nyers) -%}
            {%- set fok = nyers | float(0) % 360 -%}
            {%- set ns.url = ns.url ~ '&szelirany=' ~ szam(fok) | trim -%}
          {%- elif nyers is string and egtajak.get(nyers | lower | trim) is not none -%}
            {%- set ns.url = ns.url ~ '&szelirany=' ~ szam(egtajak[nyers | lower | trim]) | trim -%}
          {%- endif -%}
        {%- endif -%}

        {#- Szélsebesség és széllökés: m/s-ra váltva a szenzor egysége alapján -#}
        {%- for kulcs, ent in [('szelero', wspeed_sensor), ('szellokes', wgust_sensor)] -%}
          {%- if ent not in ['', none] and is_number(states(ent)) -%}
            {%- set egyseg = (state_attr(ent, 'unit_of_measurement') or 'km/h') | lower | trim -%}
            {%- set szorzo = ms_szorzo.get(egyseg, 0.2777778) -%}
            {%- set ns.url = ns.url ~ '&' ~ kulcs ~ '=' ~ szam(states(ent) | float(0) * szorzo) | trim -%}
          {%- endif -%}
        {%- endfor -%}

        {{ ns.url ~ '&tipus=egyeb' }}
